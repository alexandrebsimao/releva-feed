# Temporary buffer paths in /tmp to guarantee writability and directory existence
client_body_temp_path /tmp/client_body_temp;
fastcgi_temp_path /tmp/fastcgi_temp;

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Manifest - no-cache so changes are picked up immediately on deploy
location = /build/manifest.json {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# Static assets generated by Vite with hashed filenames
location ^~ /build/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Livewire endpoint requests
location ~ ^/livewire-[a-f0-9]+/ {
    try_files $uri $uri/ /index.php?$query_string;
}

# Laravel Front Controller fallback
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Block hidden files (.env, .git, etc.)
location ~ /\. {
    deny all;
}
