services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: ${APP_KEY:-base64:fqygs5A1i3Vtzjt7x0YoB5R1/q5tujneP3qVJMZRek8=}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-releva_feed}
      DB_USERNAME: ${DB_USERNAME:-releva}
      DB_PASSWORD: ${DB_PASSWORD:-releva}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - .:/var/www/html
      - releva_vendor:/var/www/html/vendor
      - releva_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["php-fpm", "-F"]
    healthcheck:
      test: ["CMD-SHELL", "php artisan about >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - .:/var/www/html:ro
      - releva_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-releva_feed}
      POSTGRES_USER: ${DB_USERNAME:-releva}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-releva}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - releva_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-releva} -d ${DB_DATABASE:-releva_feed}"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:fqygs5A1i3Vtzjt7x0YoB5R1/q5tujneP3qVJMZRek8=}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-releva_feed}
      DB_USERNAME: ${DB_USERNAME:-releva}
      DB_PASSWORD: ${DB_PASSWORD:-releva}
    volumes:
      - .:/var/www/html
      - releva_vendor:/var/www/html/vendor
      - releva_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["php"]
    command: ["artisan", "queue:work", "--queue=feeds,articles,digests,topics,default", "--sleep=3", "--tries=3", "--timeout=180"]

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:fqygs5A1i3Vtzjt7x0YoB5R1/q5tujneP3qVJMZRek8=}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-releva_feed}
      DB_USERNAME: ${DB_USERNAME:-releva}
      DB_PASSWORD: ${DB_PASSWORD:-releva}
    volumes:
      - .:/var/www/html
      - releva_vendor:/var/www/html/vendor
      - releva_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["php"]
    command: ["artisan", "schedule:work"]

  frontend:
    image: node:22-bookworm-slim
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - releva_node_modules:/var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_DASHBOARD_PORT:-8025}:8025"

volumes:
  releva_pgdata:
  releva_vendor:
  releva_storage:
  releva_node_modules:
